site_name: STAR WARS STORYTELLER · Holocron de campaña
site_description: Wiki de campaña de Star Wars Storyteller · La Antigua República
site_author: Jordi
docs_dir: docs

theme:
  name: material
  language: es
  palette:
    scheme: slate
    primary: black
    accent: amber
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tooltips

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - La campaña:
      - Presentación: campana/index.md
      - Cronología: cronologia/index.md
      - Diario de campaña: diario/index.md
  - La galaxia:
      - Varduun: varduun/index.md
      - Facciones: facciones/index.md
      - Personajes: personajes/index.md
      - PNJ conocidos: pnj/index.md
      - Naves y vehículos: naves/index.md
  - Holored: holored/index.md
  - Archivo: archivo/index.md
  - Reglas: reglas/index.md
