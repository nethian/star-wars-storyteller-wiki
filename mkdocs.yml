site_name: "STAR WARS STORYTELLER · Varduun: Ecos del Pasado"
site_description: "Wiki de campaña de Star Wars Storyteller · Varduun: Ecos del Pasado"
site_author: Jordi
site_url: "https://nethian.github.io/star-wars-storyteller-wiki/"
docs_dir: docs

theme:
  name: material
  language: es
  logo: assets/images/emblem-storyteller.svg
  favicon: assets/images/emblem-storyteller.svg
  palette:
    scheme: slate
    primary: black
    accent: amber
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.tooltips

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Inicio: index.md
  - La campaña:
      - Presentación: campana/index.md
      - Cronología: cronologia/index.md
      - Diario de campaña: diario/index.md
  - La galaxia:
      - Varduun:
          - Visión general: varduun/index.md
          - Regiones: varduun/regiones.md
          - Asentamientos: varduun/asentamientos.md
          - Sociedad: varduun/sociedad.md
          - Presencia imperial: varduun/presencia-imperial.md
          - Facciones locales: varduun/facciones-locales.md
          - Lugares importantes: varduun/lugares.md
          - Rumores conocidos: varduun/rumores.md
          - Cronología local: varduun/cronologia.md
      - Facciones: facciones/index.md
      - Personajes: personajes/index.md
      - PNJ conocidos: pnj/index.md
      - Naves y vehículos: naves/index.md
  - Holored: holored/index.md
  - Archivo: archivo/index.md
  - Reglas: reglas/index.md
